}
@media (prefers-color-scheme: dark) {

    --accent: #3987e5; --good: #3fae3f; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px 0; }

h1 { font-size: 20px; margin: 0; font-weight: 600; }
.sub { color: var(--text-2); font-size: 13px; }
.spacer { flex: 1; }
button.theme { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);

nav { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
nav button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-2);
  padding: 8px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; overflow-x: hidden; }
.page { display: none; } .page.active { display: block; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: end; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-2); gap: 3px; }
.filters select { background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; font: inherit; min-width: 130px; }
.filters .count { font-size: 12px; color: var(--muted); padding-bottom: 7px; }
.filters button { background: none; border: 1px solid var(--border); color: var(--text-2); border-radius: 6px;
  padding: 5px 10px; font: inherit; cursor: pointer; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .l { font-size: 12px; color: var(--text-2); }
.kpi .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .n { font-size: 11px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 14px; font-weight: 600; }
.card .note { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.card .head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.card .tbtn { background: none; border: 1px solid var(--border); color: var(--text-2); border-radius: 5px;
  font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer; flex-shrink: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; overflow: visible; }
svg text { fill: var(--text-2); font-size: 11px; }
svg .val { fill: var(--text); font-size: 11px; }
svg .ax { stroke: var(--grid); stroke-width: 1; }
svg [data-tip]:hover { opacity: .8; }
.tablewrap { max-height: 380px; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); color: var(--text-2); font-weight: 600; cursor: pointer; }
th:first-child, td:first-child, td.t, th.t { text-align: left; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 10; max-width: 280px; }
#tip b { display: block; font-size: 14px; }
#tip span { color: var(--text-2); display: block; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 24px 24px; }
@media (max-width: 640px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .kpi .v { font-size: 18px; }
}
</style>

/* ------------------------------------------------------------------ formatting */
const fmtM = v => v == null ? "–" : (Math.abs(v) >= 1e9 ? (v / 1e9).toFixed(2) + "B" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(0) + "K" : v.toFixed(0));
const egp = v => v == null ? "–" : "EGP " + fmtM(v);
const pct = (v, d = 1) => v == null ? "–" : (v * 100).toFixed(d) + "%";
const num = v => v == null ? "–" : Math.round(v).toLocaleString("en-US");
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const sum = a => a.reduce((s, x) => s + x, 0);
const uniq = a => [...new Set(a)];
const TYPES = ["Apartment", "Chalet", "Townhouse", "Villa", "Duplex", "Penthouse"];
const STATUS = [["Available", "var(--s1)"], ["Reserved", "var(--s2)"], ["Sold", "var(--s3)"]];
const NS = "http://www.w3.org/2000/svg";

/* ------------------------------------------------------------------ small DOM helpers (text via textContent only) */
function el(tag, attrs = {}, parent) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v; else if (k === "cls") e.setAttribute("class", v); else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function svgText(parent, x, y, s, attrs = {}) { return el("svg:text", Object.assign({ x, y, text: s }, attrs), parent); }

/* tooltip: marks carry data-tip="value|label|label2" */
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!t) { tip.style.display = "none"; return; }
  tip.replaceChildren();
  const parts = t.getAttribute("data-tip").split("|");
  el("b", { text: parts[0] }, tip);
  parts.slice(1).forEach(p => el("span", { text: p }, tip));
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, e.clientY - h - 10) + "px";
});

/* ------------------------------------------------------------------ card with chart / table toggle */
function card(parent, title, note, opts = {}) {
  const c = el("div", { cls: "card" + (opts.wide ? " wide" : "") }, parent);
  const head = el("div", { cls: "head" }, c);
  const t = el("div", {}, head);
  el("h3", { text: title }, t);
  if (note) el("div", { cls: "note", text: note }, t);
  const body = el("div", {}, c);
  c.render = (drawFn, table) => {
    let showTable = false;
    const btn = table ? el("button", { cls: "tbtn", type: "button", text: "Table" }, head) : null;
    const paint = () => {
      body.replaceChildren();
      if (showTable) tableView(body, table.cols, table.rows); else drawFn(body);
      if (btn) btn.textContent = showTable ? "Chart" : "Table";
    };
    if (btn) btn.onclick = () => { showTable = !showTable; paint(); };
    c.paint = paint;
    paint();
  };
  return c;
}

function legend(parent, items) {
  const l = el("div", { cls: "legend" }, parent);
  items.forEach(([name, color]) => { const s = el("span", {}, l); el("i", { style: "background:" + color }, s); s.appendChild(document.createTextNode(name)); });
}

function tableView(parent, cols, rows) {
  const wrap = el("div", { cls: "tablewrap" }, parent);
  const tbl = el("table", {}, wrap);
  const thead = el("thead", {}, tbl), tr = el("tr", {}, thead), tbody = el("tbody", {}, tbl);
  let sortKey = null, asc = true;
  const draw = () => {
    tbody.replaceChildren();
    const rs = sortKey == null ? rows : [...rows].sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null) return 1; if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1);
    });
    rs.forEach(r => {
      const row = el("tr", {}, tbody);
      cols.forEach(c => el("td", { cls: c.t ? "t" : "", text: c.f ? c.f(r[c.k]) : (r[c.k] ?? "–") }, row));
    });
  };
  cols.forEach(c => {
    const th = el("th", { cls: c.t ? "t" : "", text: c.l, title: "Sort" }, tr);
    th.onclick = () => { asc = sortKey === c.k ? !asc : false; sortKey = c.k; draw(); };
  });
  draw();
}

/* ------------------------------------------------------------------ charts */
function width(parent) { return Math.max(parent.clientWidth || 0, 280); }
function nTicks(max) { const n = Math.round(max / Math.pow(10, Math.floor(Math.log10(max))) * 10) / 10; return (n === 2.5 || n === 5) ? 5 : 4; }
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function roundedBarH(g, x, y, w, h, fill, tipText) {
  // 4px rounded data-end (right), square at the baseline (left)
  const r = Math.min(4, w / 2, h / 2);
  const d = w <= 0 ? "" : `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  return el("svg:path", { d, fill, "data-tip": tipText }, g);
}
function roundedBarV(g, x, y, w, h, fill, tipText) {
  const r = Math.min(4, w / 2, h / 2);
  const d = h <= 0 ? "" : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  return el("svg:path", { d, fill, "data-tip": tipText }, g);
}

/* horizontal bars, one series. rows: [{label, value, tip}] */
function hbar(parent, rows, o = {}) {
  if (!rows.length) { el("div", { cls: "empty", text: "No units match the filters" }, parent); return; }
  const W = width(parent), lw = o.labelW || 110, rw = 70, bh = 18, gap = 10;
  const H = rows.length * (bh + gap) + 4;
  const svg = el("svg:svg", { width: W, height: H, role: "img" }, parent);
  const max = o.max || niceMax(Math.max(...rows.map(r => r.value || 0)));
  const sx = v => (W - lw - rw) * Math.max(v, 0) / max;
  rows.forEach((r, i) => {
    const y = i * (bh + gap) + 2;
    svgText(svg, lw - 8, y + bh / 2 + 4, r.label, { "text-anchor": "end" });
    roundedBarH(svg, lw, y, sx(r.value || 0), bh, r.color || o.color || "var(--s1)", r.tip || (o.fmt(r.value) + "|" + r.label));
    svgText(svg, lw + sx(r.value || 0) + 6, y + bh / 2 + 4, o.fmt(r.value), { cls: "val" });
  });
}

/* horizontal stacked bars. cats: [label], series: [{name,color,values[]}] */
function hstack(parent, cats, series, o = {}) {
  legend(parent, series.map(s => [s.name, s.color]));
  const W = width(parent), lw = o.labelW || 110, rw = 50, bh = 18, gap = 10;
  const H = cats.length * (bh + gap) + 4;
  const svg = el("svg:svg", { width: W, height: H, role: "img" }, parent);
  const totals = cats.map((_, i) => sum(series.map(s => s.values[i])));
  const max = niceMax(Math.max(...totals, 1));
  const sx = v => (W - lw - rw) * v / max;
  cats.forEach((c, i) => {
    const y = i * (bh + gap) + 2;
    svgText(svg, lw - 8, y + bh / 2 + 4, c, { "text-anchor": "end" });
    let x = lw;
    const live = series.filter(s => s.values[i] > 0);
    live.forEach((s, j) => {
      const w = sx(s.values[i]);
      const last = j === live.length - 1;
      const tipText = num(s.values[i]) + " units|" + s.name + " · " + c;
      if (last) roundedBarH(svg, x, y, Math.max(w - 0, 0), bh, s.color, tipText);
      else el("svg:rect", { x, y, width: Math.max(w - 2, 0), height: bh, fill: s.color, "data-tip": tipText }, svg);
      x += w;
    });
    svgText(svg, x + 6, y + bh / 2 + 4, num(totals[i]), { cls: "val" });
  });
}

/* horizontal grouped bars (2-3 series on one axis) */
function hgroup(parent, cats, series, o = {}) {
  legend(parent, series.map(s => [s.name, s.color]));
  const W = width(parent), lw = o.labelW || 110, rw = 70, bh = 12, inner = 2, gap = 12;
  const gh = series.length * (bh + inner);
  const H = cats.length * (gh + gap) + 4;
  const svg = el("svg:svg", { width: W, height: H, role: "img" }, parent);
  const max = niceMax(Math.max(...series.flatMap(s => s.values.filter(v => v != null)), 1));
  const sx = v => (W - lw - rw) * Math.max(v || 0, 0) / max;
  cats.forEach((c, i) => {
    const y0 = i * (gh + gap) + 2;
    svgText(svg, lw - 8, y0 + gh / 2 + 4, c, { "text-anchor": "end" });
    series.forEach((s, j) => {
      const y = y0 + j * (bh + inner), v = s.values[i];
      if (v == null) return;
      roundedBarH(svg, lw, y, sx(v), bh, s.color, o.fmt(v) + "|" + s.name + " · " + c);
      svgText(svg, lw + sx(v) + 6, y + bh - 2, o.fmt(v), { cls: "val" });
    });
  });
}

/* vertical columns (histograms). rows: [{label, value, tip}] */
function columns(parent, rows, o = {}) {
  const W = width(parent), H = o.h || 220, pl = 40, pb = 34, pt = 10;
  const svg = el("svg:svg", { width: W, height: H, role: "img" }, parent);
  const max = niceMax(Math.max(...rows.map(r => r.value), 1));
  const band = (W - pl - 6) / rows.length, bw = Math.min(24, band - 2);
  const sy = v => (H - pb - pt) * v / max;
  for (let k = 0, K = nTicks(max); k <= K; k++) {
    const v = max * k / K, y = H - pb - sy(v);
    el("svg:line", { x1: pl, x2: W, y1: y, y2: y, cls: "ax" }, svg);
    svgText(svg, pl - 6, y + 4, o.yfmt ? o.yfmt(v) : num(v), { "text-anchor": "end" });
  }
  rows.forEach((r, i) => {
    const x = pl + i * band + (band - bw) / 2;
    roundedBarV(svg, x, H - pb - sy(r.value), bw, sy(r.value), o.color || "var(--s1)", r.tip || (num(r.value) + "|" + r.label));
    if (rows.length <= 14 || i % Math.ceil(rows.length / 10) === 0)
      svgText(svg, x + bw / 2, H - pb + 14, r.label, { "text-anchor": "middle" });
  });
  if (o.xlabel) svgText(svg, pl + (W - pl) / 2, H - 4, o.xlabel, { "text-anchor": "middle" });
}

/* line chart with crosshair. xs: labels, ys: values */
function line(parent, xs, ys, o = {}) {
  const W = width(parent), H = o.h || 200, pl = 40, pb = 28, pt = 10, pr = 30;
  const svg = el("svg:svg", { width: W, height: H, role: "img" }, parent);
  const max = niceMax(Math.max(...ys, 1));
  const sx = i => pl + (W - pl - pr) * i / Math.max(xs.length - 1, 1);
  const sy = v => H - pb - (H - pb - pt) * v / max;
  for (let k = 0, K = nTicks(max); k <= K; k++) {
    const v = max * k / K;
    el("svg:line", { x1: pl, x2: W - pr, y1: sy(v), y2: sy(v), cls: "ax" }, svg);
    svgText(svg, pl - 6, sy(v) + 4, num(v), { "text-anchor": "end" });
  }
  xs.forEach((x, i) => { if (i % 3 === 0) svgText(svg, sx(i), H - 8, x, { "text-anchor": "middle" }); });
  el("svg:path", { d: "M" + ys.map((v, i) => sx(i) + "," + sy(v)).join("L") + `L${sx(ys.length - 1)},${sy(0)}L${sx(0)},${sy(0)}Z`,
    fill: o.color || "var(--s1)", "fill-opacity": .1 }, svg);
  el("svg:path", { d: "M" + ys.map((v, i) => sx(i) + "," + sy(v)).join("L"), fill: "none", stroke: o.color || "var(--s1)",
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  const n = ys.length - 1;
  el("svg:circle", { cx: sx(n), cy: sy(ys[n]), r: 4, fill: o.color || "var(--s1)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  svgText(svg, sx(n) + 6, sy(ys[n]) - 6, num(ys[n]), { cls: "val" });
  // crosshair: one transparent column per x
  const cross = el("svg:line", { y1: pt, y2: H - pb, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" }, svg);
  const step = (W - pl - pr) / Math.max(n, 1);
  xs.forEach((x, i) => {
    const r = el("svg:rect", { x: sx(i) - step / 2, y: pt, width: step, height: H - pb - pt, fill: "transparent",
      "data-tip": num(ys[i]) + " " + (o.unit || "") + "|" + x }, svg);
    r.addEventListener("pointerenter", () => { cross.setAttribute("x1", sx(i)); cross.setAttribute("x2", sx(i)); cross.setAttribute("visibility", "visible"); });
    r.addEventListener("pointerleave", () => cross.setAttribute("visibility", "hidden"));
  });
}

/* scatter. series: [{name,color,pts:[{x,y,tip}]}] */
function scatter(parent, series, o = {}) {
  if (series.length > 1) legend(parent, series.map(s => [s.name, s.color]));
  const W = width(parent), H = o.h || 260, pl = 54, pb = 36, pt = 10, pr = 14;
  const svg = el("svg:svg", { width: W, height: H, role: "img" }, parent);
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el("div", { cls: "empty", text: "No units match the filters" }, parent); return; }
  // round axis ends to clean steps so tick labels are tidy (0 / 100 / 200 ...)
  const lo = v => { const st = niceMax(Math.abs(v) || 1) / 10; return Math.floor(v / st) * st; };
  let x0 = o.xmin ?? lo(Math.min(...all.map(p => p.x))), x1 = niceMax(Math.max(...all.map(p => p.x)));
  let y0 = o.ymin ?? Math.min(0, ...all.map(p => p.y)), y1 = niceMax(Math.max(...all.map(p => p.y)));
  if (o.sameAxes) { x0 = y0 = Math.min(x0, lo(Math.min(...all.map(p => p.y)))); x1 = y1 = Math.max(x1, y1); }
  if (x1 === x0) x1 = x0 + 1;
  const sx = v => pl + (W - pl - pr) * (v - x0) / (x1 - x0), sy = v => H - pb - (H - pb - pt) * (v - y0) / (y1 - y0);
  for (let k = 0, K = nTicks(y1 - y0); k <= K; k++) {
    const v = y0 + (y1 - y0) * k / K;
    el("svg:line", { x1: pl, x2: W - pr, y1: sy(v), y2: sy(v), cls: "ax" }, svg);
    svgText(svg, pl - 6, sy(v) + 4, o.yfmt(v), { "text-anchor": "end" });
    const xv = x0 + (x1 - x0) * k / K;
    svgText(svg, sx(xv), H - pb + 14, o.xfmt(xv), { "text-anchor": "middle" });
  }
  if (o.xlabel) svgText(svg, pl + (W - pl) / 2, H - 4, o.xlabel, { "text-anchor": "middle" });
  if (o.ylabel) svgText(svg, 12, pt + (H - pb) / 2, o.ylabel, { "text-anchor": "middle", transform: `rotate(-90 12 ${pt + (H - pb) / 2})` });
  if (o.diag) el("svg:line", { x1: sx(Math.max(x0, y0)), y1: sy(Math.max(x0, y0)), x2: sx(Math.min(x1, y1)), y2: sy(Math.min(x1, y1)), stroke: "var(--muted)", "stroke-width": 1 }, svg);
  series.forEach(s => s.pts.forEach(p => {
    const g = el("svg:g", { "data-tip": p.tip }, svg);
    el("svg:circle", { cx: sx(p.x), cy: sy(p.y), r: 12, fill: "transparent" }, g);   // 24px hit area
    el("svg:circle", { cx: sx(p.x), cy: sy(p.y), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, g);
  }));
}

function kpis(parent, items) {
  const k = el("div", { cls: "kpis" }, parent);
  items.forEach(([label, value, note]) => {
    const c = el("div", { cls: "kpi" }, k);
    el("div", { cls: "l", text: label }, c);
    el("div", { cls: "v", text: value }, c);
    if (note) el("div", { cls: "n", text: note }, c);
  });
}

/* filter row: defs [{key, label, values}] -> calls onChange(state) */
function filterRow(parent, defs, onChange) {
  const f = el("div", { cls: "filters" }, parent), state = {};
  const count = el("span", { cls: "count" });
  defs.forEach(d => {
    const lab = el("label", { text: d.label }, f);
    const s = el("select", {}, lab);
    el("option", { value: "", text: "All" }, s);
    d.values.forEach(v => el("option", { value: String(v), text: String(v) }, s));
    s.onchange = () => { state[d.key] = s.value; onChange(state, count); };
    d.sel = s;
  });
  const reset = el("button", { type: "button", text: "Reset" }, f);
  reset.onclick = () => { defs.forEach(d => { d.sel.value = ""; state[d.key] = ""; }); onChange(state, count); };
  f.appendChild(count);
  return { state, count };
}
const applyFilters = (rows, st) => rows.filter(r => Object.entries(st).every(([k, v]) => v === "" || v == null || String(r[k]) === v));

/* ------------------------------------------------------------------ aggregates */
function statusByCat(rows, key, cats) {
  return { cats: cats.map(String), series: STATUS.map(([s, c]) => ({ name: s, color: c, values: cats.map(cat => rows.filter(r => r[key] === cat && r.st === s).length) })) };
}
function byType(rows, f, filt = r => true) {
  return TYPES.map(t => ({ t, v: avg(rows.filter(r => r.ty === t && filt(r)).map(f).filter(v => v != null)) })).filter(x => x.v != null);
}
const statusTable = (cats, series, label) => ({ cols: [{ k: "c", l: label, t: 1 }, ...series.map(s => ({ k: s.name, l: s.name, f: num })), { k: "tot", l: "Total", f: num }],
  rows: cats.map((c, i) => Object.assign({ c, tot: sum(series.map(s => s.values[i])) }, Object.fromEntries(series.map(s => [s.name, s.values[i]])))) });

/* ================================================================== PAGE 1 */
function page1(p) {
  const U = D.units, P1 = U.filter(u => u.ph === 1), sold = P1.filter(u => u.st === "Sold");
  kpis(p, [
    ["Phase 1 units", num(U.length), "on sale since " + D.meta.launch],
    ["Available", num(U.filter(u => u.st === "Available").length), "Phase 1, on sale"],
    ["Reserved", num(U.filter(u => u.st === "Reserved").length), "active reservations"],
    ["Sold", num(sold.length), pct(sold.length / P1.length, 0) + " of Phase 1"],
    ["Inventory value", egp(sum(P1.filter(u => u.st === "Available").map(u => u.lp))), "available units at list price"],
    ["Average selling price", egp(avg(sold.map(u => u.cp))), "signed contracts"],
    ["Average price per sqm", egp(avg(P1.map(u => u.pps))), "Phase 1 list"],
    ["Average gross margin", pct(avg(P1.map(u => u.gm))), "list price vs development cost"],
    ["Average days on market", num(avg(sold.map(u => u.dom))), "sold units"],
  ]);
  const g = el("div", { cls: "grid" }, p);
  const sc = statusByCat(U, "ty", TYPES);
  card(g, "Inventory by property type", "All " + U.length + " Phase 1 units, coloured by availability").render(b => hstack(b, sc.cats, sc.series), statusTable(sc.cats, sc.series, "Property type"));
  const st = STATUS.map(([s, c]) => ({ label: s, value: U.filter(u => u.st === s).length, color: c }));
  card(g, "Inventory by status", "Phase 1 units").render(b => hbar(b, st, { fmt: num }),
    { cols: [{ k: "label", l: "Status", t: 1 }, { k: "value", l: "Units", f: num }], rows: st });
  const pr = byType(P1, u => u.lp).map(x => ({ label: x.t, value: x.v }));
  card(g, "Average list price by property type", "Phase 1, latest price version").render(b => hbar(b, pr, { fmt: egp, color: "var(--s1)" }),
    { cols: [{ k: "label", l: "Type", t: 1 }, { k: "value", l: "Avg list price", f: egp }], rows: pr });
  const F = D.funnel, fn = [["Enquiries", F.enq, "var(--seq1)"], ["Viewings", F.vws, "var(--seq2)"], ["Reservations", F.res, "var(--seq3)"], ["Sales", F.sal, "var(--seq4)"]]
    .map(([l, v, c], i, a) => ({ label: l, value: v, color: c, tip: num(v) + "|" + l + (i ? " · " + pct(v / a[i - 1][1]) + " of previous stage" : "") }));
  card(g, "Sales funnel", "Phase 1, launch to report date").render(b => hbar(b, fn, { fmt: num }),
    { cols: [{ k: "label", l: "Stage", t: 1 }, { k: "value", l: "Count", f: num }], rows: fn });
}

/* ================================================================== PAGE 2 */
function page2(p) {
  const U = D.units;
  const body = el("div");
  const f = filterRow(p, [
    { key: "cl", label: "Cluster", values: uniq(U.map(u => u.cl)).sort() }, { key: "ty", label: "Property type", values: TYPES },
    { key: "bd", label: "Bedrooms", values: uniq(U.map(u => u.bd)).sort() }, { key: "st", label: "Availability", values: STATUS.map(s => s[0]) },
    { key: "vw", label: "View type", values: uniq(U.map(u => u.vw)).sort() }, { key: "plan", label: "Payment plan", values: uniq(U.filter(u => u.plan).map(u => u.plan)).sort() },
  ], (st, count) => draw(st, count));
  p.appendChild(body);
  function draw(st, count) {
    body.replaceChildren();
    const R = applyFilters(U, st), P = R.filter(u => u.lp != null);
    count.textContent = `${R.length} units match`;
    kpis(body, [["Units", num(R.length)], ["Priced units", num(P.length)], ["Average list price", egp(avg(P.map(u => u.lp)))],
      ["Average price per sqm", egp(avg(P.map(u => u.pps)))], ["Average development cost", egp(avg(R.map(u => u.tdc)))],
      ["Average gross margin", pct(avg(P.map(u => u.gm)))]]);
    const g = el("div", { cls: "grid" }, body);
    const a = statusByCat(R, "cl", uniq(U.map(u => u.cl)).sort());
    card(g, "Inventory by cluster").render(b => hstack(b, a.cats, a.series, { labelW: 100 }), statusTable(a.cats, a.series, "Cluster"));
    const beds = uniq(U.map(u => u.bd)).sort(), bb = statusByCat(R, "bd", beds); bb.cats = beds.map(x => x + " bed");
    card(g, "Inventory by bedrooms").render(b => hstack(b, bb.cats, bb.series, { labelW: 70 }), statusTable(bb.cats, bb.series, "Bedrooms"));
    const edges = [0, 4, 6, 8, 10, 15, 20, 30, 40, 60, 1e9], lab = ["<4M", "4–6M", "6–8M", "8–10M", "10–15M", "15–20M", "20–30M", "30–40M", "40–60M", "60M+"];
    const hist = lab.map((l, i) => { const v = P.filter(u => u.lp >= edges[i] * 1e6 && u.lp < edges[i + 1] * 1e6).length; return { label: l, value: v, tip: num(v) + " units|List price " + l }; });
    card(g, "Price distribution", "Phase 1 list prices (EGP)").render(b => columns(b, hist, { xlabel: "List price band" }),
      { cols: [{ k: "label", l: "Band", t: 1 }, { k: "value", l: "Units", f: num }], rows: hist });
    const pps = byType(P, u => u.pps).map(x => ({ label: x.t, value: x.v }));
    card(g, "Average price per sqm by property type").render(b => hbar(b, pps, { fmt: egp }),
      { cols: [{ k: "label", l: "Type", t: 1 }, { k: "value", l: "Avg price/sqm", f: egp }], rows: pps });
    const ts = TYPES.filter(t => P.some(u => u.ty === t));
    const cs = [{ name: "Development cost", color: "var(--s2)", values: ts.map(t => avg(P.filter(u => u.ty === t).map(u => u.tdc))) },
                { name: "List price", color: "var(--s1)", values: ts.map(t => avg(P.filter(u => u.ty === t).map(u => u.lp))) }];
    card(g, "Development cost vs selling price", "Average per unit, Phase 1").render(b => hgroup(b, ts, cs, { fmt: egp }),
      { cols: [{ k: "t", l: "Type", t: 1 }, { k: "c", l: "Avg dev cost", f: egp }, { k: "p", l: "Avg list", f: egp }], rows: ts.map((t, i) => ({ t, c: cs[0].values[i], p: cs[1].values[i] })) });
    const cb = [[0, 20], [20, 40], [40, 60], [60, 80], [80, 100.1]].map(([lo, hi]) => { const v = P.filter(u => u.comp >= lo && u.comp < hi).length; return { label: `${lo}–${Math.min(hi, 100).toFixed(0)}`, value: v, tip: num(v) + " units|Score " + lo + "–" + Math.min(hi, 100).toFixed(0) }; });
    card(g, "Pricing competitiveness", "Score 0–100: price/sqm vs the median of the same type (higher = cheaper)").render(b => columns(b, cb, { xlabel: "Competitiveness score", color: "var(--s1)" }),
      { cols: [{ k: "label", l: "Score", t: 1 }, { k: "value", l: "Units", f: num }], rows: cb });
    const tc = [{ k: "id", l: "Unit", t: 1 }, { k: "ty", l: "Type", t: 1 }, { k: "bd", l: "Beds" }, { k: "vw", l: "View", t: 1 }, { k: "st", l: "Status", t: 1 },
      { k: "lp", l: "List price", f: egp }, { k: "pps", l: "Price/sqm", f: num }, { k: "tdc", l: "Dev cost", f: egp }, { k: "gm", l: "Margin", f: pct }, { k: "comp", l: "Competitiveness", f: v => v == null ? "–" : v.toFixed(0) }];
    card(g, "Unit list", "Click a column header to sort", { wide: true }).render(b => tableView(b, tc, R));
  }
  draw(f.state, f.count);
}

/* ================================================================== PAGE 3 */
function page3(p) {
  const F = D.funnel, P1 = D.units.filter(u => u.ph === 1);
  kpis(p, [["Enquiries", num(F.enq)], ["Viewings", num(F.vws), pct(F.vws / F.enq) + " of enquiries"], ["Reservations", num(F.res), pct(F.res / F.vws) + " of viewings"],
    ["Sales", num(F.sal), pct(F.sal / F.res) + " of reservations"], ["Enquiry-to-sale", pct(F.sal / F.enq)],
    ["Avg days on market (sold)", num(avg(P1.filter(u => u.st === "Sold").map(u => u.dom)))],
    ["Slow-moving units", num(P1.filter(u => u.sold === "Unsold" && u.dom > D.meta.slowDays).length), `unsold > ${D.meta.slowDays} days`]]);
  const g = el("div", { cls: "grid" }, p);
  const S = D.sources;
  const se = [...S].sort((a, b) => b.enq - a.enq).map(s => ({ label: s.name, value: s.enq }));
  card(g, "Enquiries by lead source").render(b => hbar(b, se, { fmt: num, labelW: 120 }),
    { cols: [{ k: "name", l: "Source", t: 1 }, { k: "enq", l: "Enquiries", f: num }, { k: "vws", l: "Viewings", f: num }, { k: "res", l: "Reservations", f: num }, { k: "sal", l: "Sales", f: num }, { k: "val", l: "Sales value", f: egp }], rows: S });
  const sc = [...S].sort((a, b) => b.sal / b.enq - a.sal / a.enq).map(s => ({ label: s.name, value: s.sal / s.enq, tip: pct(s.sal / s.enq) + "|" + s.name + " · " + s.sal + " sales from " + s.enq + " enquiries" }));
  card(g, "Enquiry-to-sale conversion by lead source").render(b => hbar(b, sc, { fmt: v => pct(v), labelW: 120, color: "var(--s3)" }),
    { cols: [{ k: "label", l: "Source", t: 1 }, { k: "value", l: "Conversion", f: pct }], rows: sc });
  const B = D.brokers.filter(b => b.id !== "UNASSIGNED");
  const bv = [...B].sort((a, b) => b.val - a.val).map(b => ({ label: b.name, value: b.val, tip: egp(b.val) + "|" + b.name + " · " + b.sal + " sales" }));
  card(g, "Sales value by broker").render(b => hbar(b, bv, { fmt: egp, labelW: 120 }),
    { cols: [{ k: "label", l: "Broker", t: 1 }, { k: "value", l: "Sales value", f: egp }], rows: bv });
  const scat = ["Sold", "Unsold"].map((s, i) => ({ name: s, color: i ? "var(--s2)" : "var(--s1)",
    pts: P1.filter(u => u.sold === s).map(u => ({ x: u.lprem, y: u.dom, tip: num(u.dom) + " days|" + u.id + " · " + u.ty + "|Launch premium " + pct(u.lprem) }))}));
  card(g, "Launch pricing vs days on market", "Launch list price above the policy recommended price (x) vs days on market (y)").render(b =>
    scatter(b, scat, { xfmt: v => pct(v, 0), yfmt: num, xlabel: "Launch premium over recommended price", ylabel: "Days on market" }));
  const M = D.monthly;
  card(g, "Enquiries per month").render(b => line(b, M.map(m => m.m), M.map(m => m.enq), { unit: "enquiries" }),
    { cols: [{ k: "m", l: "Month", t: 1 }, { k: "enq", l: "Enquiries", f: num }, { k: "vws", l: "Viewings", f: num }, { k: "res", l: "Reservations", f: num }, { k: "sal", l: "Sales", f: num }], rows: M });
  card(g, "Sales per month").render(b => line(b, M.map(m => m.m), M.map(m => m.sal), { unit: "sales", color: "var(--s3)" }),
    { cols: [{ k: "m", l: "Month", t: 1 }, { k: "sal", l: "Sales", f: num }], rows: M });
  const bc = [{ k: "name", l: "Broker", t: 1 }, { k: "team", l: "Team", t: 1 }, { k: "enq", l: "Enquiries", f: num }, { k: "vws", l: "Viewings", f: num },
    { k: "res", l: "Reservations", f: num }, { k: "sal", l: "Sales", f: num }, { k: "conv", l: "Enquiry→sale", f: pct }, { k: "val", l: "Sales value", f: egp }, { k: "disc", l: "Avg discount", f: pct }];
  card(g, "Broker performance", "Unassigned = CRM leads with no broker recorded", { wide: true }).render(b => tableView(b, bc, D.brokers.map(x => Object.assign({ conv: x.enq ? x.sal / x.enq : null }, x))));
  const slow = P1.filter(u => u.sold === "Unsold" && u.dom > D.meta.slowDays).sort((a, b) => a.epm - b.epm);
  const sl = [{ k: "id", l: "Unit", t: 1 }, { k: "ty", l: "Type", t: 1 }, { k: "bd", l: "Beds" }, { k: "vw", l: "View", t: 1 }, { k: "lp", l: "List price", f: egp },
    { k: "dom", l: "Days on market", f: num }, { k: "enq", l: "Enquiries", f: num }, { k: "epm", l: "Enquiries / month", f: v => v.toFixed(2) },
    { k: "red", l: "Price reductions", f: num }, { k: "lprem", l: "Launch premium", f: pct }];
  card(g, `Slow-moving units (${slow.length})`, "Unsold and listed longer than " + D.meta.slowDays + " days, weakest demand first", { wide: true }).render(b => tableView(b, sl, slow));
}

/* ================================================================== PAGE 4 */
function page4(p) {
  const P1 = D.units.filter(u => u.ph === 1);
  const body = el("div");
  const f = filterRow(p, [{ key: "ty", label: "Property type", values: TYPES }, { key: "bd", label: "Bedrooms", values: uniq(P1.map(u => u.bd)).sort() },
    { key: "vw", label: "View type", values: uniq(P1.map(u => u.vw)).sort() }, { key: "band", label: "Price band", values: ["< 5M", "5–10M", "10–20M", "20–40M", "40M+"].filter(b => P1.some(u => u.band === b)) }],
    (st, count) => draw(st, count));
  p.appendChild(body);
  function draw(st, count) {
    body.replaceChildren();
    const R = applyFilters(P1, st);
    count.textContent = `${R.length} Phase 1 units match`;
    kpis(body, [["Predicted rental yield", pct(avg(R.map(u => u.yld))), "expected annual rent ÷ list price"],
      ["Annual appreciation", pct(avg(R.map(u => u.appr))), "price index, after 25% haircut"],
      ["Average list price", egp(avg(R.map(u => u.lp)))], ["Value at handover", egp(avg(R.map(u => u.vh))), "average per unit"],
      ["Value after 3 years", egp(avg(R.map(u => u.v3))), "from the report date"], ["Attractiveness score", avg(R.map(u => u.att)) == null ? "–" : avg(R.map(u => u.att)).toFixed(1), "0–100"]]);
    const g = el("div", { cls: "grid" }, body);
    const y = byType(R, u => u.yld).map(x => ({ label: x.t, value: x.v }));
    card(g, "Predicted rental yield by property type").render(b => hbar(b, y, { fmt: v => pct(v), color: "var(--s3)" }),
      { cols: [{ k: "label", l: "Type", t: 1 }, { k: "value", l: "Yield", f: pct }], rows: y });
    const a = byType(R, u => u.appr).map(x => ({ label: x.t, value: x.v }));
    card(g, "Estimated annual appreciation by property type").render(b => hbar(b, a, { fmt: v => pct(v) }),
      { cols: [{ k: "label", l: "Type", t: 1 }, { k: "value", l: "Appreciation", f: pct }], rows: a });
    const ts = TYPES.filter(t => R.some(u => u.ty === t));
    const vs = [{ name: "List price today", color: "var(--s1)", values: ts.map(t => avg(R.filter(u => u.ty === t).map(u => u.lp))) },
                { name: "Value at handover", color: "var(--s2)", values: ts.map(t => avg(R.filter(u => u.ty === t).map(u => u.vh))) },
                { name: "Value after 3 years", color: "var(--s3)", values: ts.map(t => avg(R.filter(u => u.ty === t).map(u => u.v3))) }];
    card(g, "Value today, at handover and after 3 years", "Average per unit").render(b => hgroup(b, ts, vs, { fmt: egp }),
      { cols: [{ k: "t", l: "Type", t: 1 }, ...vs.map((s, j) => ({ k: "v" + j, l: s.name, f: egp }))], rows: ts.map((t, i) => Object.assign({ t }, ...vs.map((s, j) => ({ ["v" + j]: s.values[i] })))) });
    const sc = [{ name: "Units", color: "var(--s1)", pts: R.map(u => ({ x: u.ar, y: u.yld, tip: pct(u.yld) + " yield|" + u.id + " · " + u.ty + " · " + u.ar + " sqm" })) }];
    card(g, "Smaller units yield more", "Built-up area (x) vs predicted rental yield (y)").render(b => scatter(b, sc, { xfmt: num, yfmt: v => pct(v, 1), xlabel: "Built-up area (sqm)", ylabel: "Rental yield", xmin: 0 }));
    const top = [...R].sort((a, b) => b.att - a.att);
    const cols = [{ k: "id", l: "Unit", t: 1 }, { k: "ty", l: "Type", t: 1 }, { k: "bd", l: "Beds" }, { k: "vw", l: "View", t: 1 }, { k: "st", l: "Status", t: 1 },
      { k: "lp", l: "List price", f: egp }, { k: "rent", l: "Annual rent", f: egp }, { k: "yld", l: "Yield", f: pct }, { k: "appr", l: "Appreciation", f: pct },
      { k: "vh", l: "Value at handover", f: egp }, { k: "v3", l: "Value after 3 yrs", f: egp }, { k: "att", l: "Attractiveness", f: v => v.toFixed(1) }];
    card(g, "Units ranked by Investment Attractiveness Score", "Weighted blend: yield 25%, appreciation 20%, facilities 15%, price competitiveness 15%, construction progress 10%, enquiry level 15%", { wide: true })
      .render(b => tableView(b, cols, top));
  }
  draw(f.state, f.count);
}

/* ------------------------------------------------------------------ boot, tabs, theme, resize */
const pages = { p1: page1, p2: page2, p3: page3, p4: page4 }, built = {};
function show(id) {
  document.querySelectorAll(".page").forEach(s => s.classList.toggle("active", s.id === id));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.page === id));
  const sec = document.getElementById(id);
  // build once, then always repaint: charts measure their card width only after the whole grid is laid out
  if (!built[id]) { pages[id](sec); built[id] = true; }
  repaint(sec);
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
function repaint(sec) { sec.querySelectorAll(".card").forEach(c => c.paint && c.paint()); }
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => show(b.dataset.page));
document.getElementById("themeBtn").onclick = () => {
  const dark = getComputedStyle(document.documentElement).colorScheme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => repaint(document.querySelector(".page.active")), 150); });
document.getElementById("subtitle").textContent = `${D.meta.developer} · North Coast · report date ${D.meta.report} · all values in EGP`;
document.getElementById("foot").textContent = "Synthetic portfolio data · Phase 1 only (Phase 2 is not on sale yet). Built by src/07_dashboard.py from the cleansed model and Baghoosh_Analysis.xlsx.";
show(pages[location.hash.slice(1)] ? location.hash.slice(1) : "p1");
addEventListener("load", () => scrollTo(0, 0));   // a #p3 link should not jump past the header
</script>
</body>
